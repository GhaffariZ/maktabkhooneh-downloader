name: StudyLibrary
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  StudyLibrary:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../generated/ios/assets/app
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../generated/ios/runtime/NodeMobile.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ghaffariz.maktabkhooneh
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: کتابخانه مطالعه
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            '127.0.0.1':
              NSExceptionAllowsInsecureHTTPLoads: true
schemes:
  StudyLibrary:
    build:
      targets:
        StudyLibrary: all
