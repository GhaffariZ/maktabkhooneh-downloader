plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'io.github.ghaffariz.maktabkhooneh'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'io.github.ghaffariz.maktabkhooneh'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a', 'x86_64'
                arguments '-DANDROID_STL=c++_shared',
                    "-DMK_RUNTIME_DIR=${rootProject.file('../generated/android/runtime').absolutePath.replace('\\', '/')}"
            }
        }
    }

    sourceSets { main.assets.srcDir rootProject.file('../generated/android/assets') }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
